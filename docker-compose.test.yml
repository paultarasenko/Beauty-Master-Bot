# Тестовая БД для pytest. Запуск: docker compose -f docker-compose.test.yml up -d --wait
# Порт и имя БД совпадают с TEST_DATABASE_URL по умолчанию в tests/conftest.py.
services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: beauty_bot_test
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data  # данные тестов не нужны после остановки — и так быстрее
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d beauty_bot_test"]
      interval: 2s
      timeout: 3s
      retries: 15
